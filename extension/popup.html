<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon-32.png" width="20" height="20" alt="">
    <h1>Media Saver</h1>
    <span id="helper" class="chip" title="ffmpeg 도우미 상태">도우미 확인 중</span>
    <button id="settings" class="icon-btn" title="설정" aria-label="설정">⚙</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="media" class="tab active" aria-selected="true">미디어 <span id="n-media" class="count">0</span></button>
    <button role="tab" data-tab="images" class="tab" aria-selected="false">이미지 <span id="n-images" class="count">0</span></button>
    <button role="tab" data-tab="jobs" class="tab" aria-selected="false">작업 <span id="n-jobs" class="count">0</span></button>
  </nav>

  <main>
    <section id="panel-media" class="panel" role="tabpanel">
      <div id="media-list" class="list"></div>
      <p id="media-empty" class="empty" hidden>이 페이지에서 찾은 영상·음성이 아직 없습니다.<br>영상을 재생하면 여기에 나타납니다.</p>
    </section>

    <section id="panel-images" class="panel" role="tabpanel" hidden>
      <div class="toolbar">
        <label>최소 <input id="min-px" type="number" min="0" step="50" value="200"> px</label>
        <button id="img-all" class="link-btn">전체 선택</button>
        <button id="img-none" class="link-btn">선택 해제</button>
        <span class="spacer"></span>
        <button id="img-save" class="primary" disabled>저장 (0)</button>
      </div>
      <div id="image-grid" class="grid"></div>
      <p id="images-empty" class="empty" hidden>조건에 맞는 이미지가 없습니다.</p>
    </section>

    <section id="panel-jobs" class="panel" role="tabpanel" hidden>
      <div class="toolbar">
        <button id="clear-done" class="link-btn">끝난 작업 지우기</button>
        <span class="spacer"></span>
        <button id="open-folder" class="link-btn">다운로드 폴더 열기</button>
      </div>
      <div id="job-list" class="list"></div>
      <p id="jobs-empty" class="empty" hidden>진행 중이거나 끝난 작업이 없습니다.</p>
      <details id="history-box">
        <summary>최근 기록 <span id="n-history"></span></summary>
        <div id="history-list" class="history"></div>
        <button id="clear-history" class="link-btn">기록 지우기</button>
      </details>
    </section>
  </main>

  <footer class="bottom">횟수 제한 없음 · 모든 처리는 이 컴퓨터 안에서만</footer>

  <template id="tpl-media">
    <article class="card media">
      <div class="row">
        <span class="badge"></span>
        <strong class="title"></strong>
        <span class="dur"></span>
      </div>
      <div class="src"></div>
      <div class="row controls">
        <select class="quality" aria-label="화질"></select>
        <span class="size"></span>
        <span class="spacer"></span>
        <button class="copy link-btn" title="주소 복사">주소 복사</button>
        <button class="save primary">저장</button>
      </div>
      <div class="subs" hidden><span class="subs-label">자막</span></div>
      <div class="msg"></div>
    </article>
  </template>

  <template id="tpl-job">
    <article class="card job">
      <div class="row">
        <span class="badge"></span>
        <strong class="title"></strong>
        <span class="status"></span>
      </div>
      <div class="bar"><div class="fill"></div></div>
      <div class="detail"></div>
      <div class="outputs"></div>
      <div class="row actions">
        <span class="spacer"></span>
        <button class="stop link-btn" hidden>중지</button>
        <button class="cancel link-btn" hidden>취소</button>
        <button class="reveal link-btn" hidden>Finder에서 보기</button>
        <button class="remove link-btn" hidden>목록에서 지우기</button>
      </div>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
